<svg viewBox="0 0 850 330" width="100%" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="55%" stop-color="#12131d" />
      <stop offset="100%" stop-color="#1c0e1e" />
    </linearGradient>

    <linearGradient id="aboutBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>

    <filter id="sakuraGlowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .about-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ff7597;
      letter-spacing: 2px;
    }
    .about-head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 26px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .about-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: #aeb8c7;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #ff608f;
    }
    .stat-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #8c97a8;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #ffdbe6;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #9aa5b5;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="20" fill="url(#aboutBg)" stroke="url(#aboutBorder)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="720" cy="160" r="110" fill="#ff2a75" fill-opacity="0.1" filter="blur(30px)" />

  <!-- LEFT COLUMN -->
  <g transform="translate(45, 36)">
    <text x="0" y="0" class="about-tag">DISCOVER MY STORY</text>
    <text x="0" y="32" class="about-head">🌸 About Me 🌸</text>
    
    <text x="0" y="66" class="about-body">I am a passionate software developer dedicated to creating</text>
    <text x="0" y="86" class="about-body">scalable, elegant, and responsive digital products. I blend clean</text>
    <text x="0" y="106" class="about-body">modern architecture with thoughtful, intuitive aesthetic design.</text>

    <!-- 4 Stats Boxes Grid -->
    <g transform="translate(0, 130)">
      <!-- Stat 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">30+</text>
        <text x="14" y="44" class="stat-lbl">Projects &amp; Repositories</text>
      </g>
      
      <!-- Stat 2 -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">500+</text>
        <text x="14" y="44" class="stat-lbl">GitHub Contributions</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">100%</text>
        <text x="14" y="44" class="stat-lbl">Code Craftsmanship</text>
      </g>

      <!-- Stat 4 -->
      <g transform="translate(200, 66)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">24 / 7</text>
        <text x="14" y="44" class="stat-lbl">Growth &amp; Innovation</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Philosophy & Mission Cards -->
  <g transform="translate(485, 45)">
    <!-- Philosophy Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="110" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ff7597" stroke-opacity="0.15" stroke-width="1" />
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentLineGrad)" />
      <text x="20" y="30" class="card-title">✦ My Philosophy</text>
      <text x="20" y="55" class="card-desc">Harmonizing sleek aesthetic design with robust,</text>
      <text x="20" y="74" class="card-desc">modern software engineering. Clean under the</text>
      <text x="20" y="93" class="card-desc">hood, delightful on the screen.</text>
    </g>

    <!-- Mission Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="320" height="110" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ff7597" stroke-opacity="0.15" stroke-width="1" />
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentLineGrad)" />
      <text x="20" y="30" class="card-title">✦ The Mission</text>
      <text x="20" y="55" class="card-desc">Transforming complex challenges into simple,</text>
      <text x="20" y="74" class="card-desc">elegant architectures and intuitive interfaces</text>
      <text x="20" y="93" class="card-desc">that empower users worldwide.</text>
    </g>
  </g>
</svg>
