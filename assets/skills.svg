<svg viewBox="0 0 850 340" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c13" />
      <stop offset="60%" stop-color="#12131d" />
      <stop offset="100%" stop-color="#1a0d1b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradSkills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.4" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="70%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ffaec5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sakuraGlowSkills" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .section-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #ff8fae;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .skill-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e6ebf5;
    }
    .skill-percent {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #ff7597;
      text-anchor: end;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="336" rx="20" fill="url(#skillsBg)" stroke="url(#borderGradSkills)" stroke-width="1.5" />

  <!-- Ambient Pink Glow -->
  <circle cx="425" cy="180" r="90" fill="#ff2a75" fill-opacity="0.12" filter="blur(25px)" />

  <!-- Title & Subtitle -->
  <text x="425" y="44" class="section-title">🌸 My Skills &amp; Proficiencies 🌸</text>
  <text x="425" y="66" class="section-subtitle">— TECHNOLOGIES I WORK WITH —</text>

  <!-- ================= LEFT COLUMN ================= -->
  <!-- Skill 1: React.js & Next.js -->
  <g transform="translate(45, 95)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">React.js / Next.js</text>
    <text x="299" y="24" class="skill-percent">95%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="268" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>

  <!-- Skill 2: JavaScript / TypeScript -->
  <g transform="translate(45, 165)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">JavaScript / TypeScript</text>
    <text x="299" y="24" class="skill-percent">90%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="255" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>

  <!-- Skill 3: Tailwind CSS & UI Design -->
  <g transform="translate(45, 235)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">Tailwind CSS &amp; UI Design</text>
    <text x="299" y="24" class="skill-percent">92%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="260" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>

  <!-- ================= CENTER SAKURA BRANCH ================= -->
  <g transform="translate(425, 205)" filter="url(#sakuraGlowSkills)">
    <!-- Branch Stem -->
    <path d="M 0 65 Q -3 20 2 -15 T -5 -75 Q -3 -88 0 -95" stroke="#451221" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 15 Q -18 0 -28 5" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 1 -25 Q 22 -40 32 -33" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M -3 -55 Q -16 -65 -22 -62" stroke="#451221" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Top Blossom -->
    <g transform="translate(0, -96) scale(0.85)">
      <circle cx="-6" cy="-4" r="6" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6" fill="#ff7597" />
      <circle cx="-7" cy="5" r="6" fill="#ff4d8d" />
      <circle cx="7" cy="5" r="6" fill="#ff4d8d" />
      <circle cx="0" cy="8" r="6" fill="#ff2a75" />
      <circle cx="0" cy="2" r="2.5" fill="#fff" />
    </g>

    <!-- Branch Blossom Left -->
    <g transform="translate(-28, 5) scale(0.95)">
      <circle cx="-6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="-7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="0" cy="9" r="6.5" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3" fill="#fff" />
    </g>

    <!-- Branch Blossom Right -->
    <g transform="translate(32, -33) scale(1)">
      <circle cx="-6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="-7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="0" cy="10" r="7" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3.2" fill="#fff" />
    </g>

    <!-- Branch Blossom Small Upper Left -->
    <g transform="translate(-22, -62) scale(0.7)">
      <circle cx="-5" cy="-3" r="5" fill="#ff7597" />
      <circle cx="5" cy="-3" r="5" fill="#ff7597" />
      <circle cx="-6" cy="4" r="5" fill="#ff4d8d" />
      <circle cx="6" cy="4" r="5" fill="#ff4d8d" />
      <circle cx="0" cy="6" r="5" fill="#ff2a75" />
      <circle cx="0" cy="1.5" r="2" fill="#fff" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN ================= -->
  <!-- Skill 4: Node.js & Express -->
  <g transform="translate(490, 95)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">Node.js &amp; Express</text>
    <text x="299" y="24" class="skill-percent">88%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="249" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>

  <!-- Skill 5: Databases (MongoDB / SQL) -->
  <g transform="translate(490, 165)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">MongoDB &amp; Databases</text>
    <text x="299" y="24" class="skill-percent">84%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="237" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>

  <!-- Skill 6: Git, GitHub & DevOps -->
  <g transform="translate(490, 235)">
    <rect x="0" y="0" width="315" height="54" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.16" stroke-width="1" />
    <text x="16" y="24" class="skill-title">Git &amp; GitHub Architecture</text>
    <text x="299" y="24" class="skill-percent">94%</text>
    <rect x="16" y="34" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="34" width="266" height="6" rx="3" fill="url(#barGrad)" filter="url(#sakuraGlowSkills)" />
  </g>
</svg>
