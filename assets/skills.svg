<svg viewBox="0 0 850 330" width="100%" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d" />
      <stop offset="60%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#180a18" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradSkills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.4" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="70%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ffaec5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="barGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 42, 117, 0.45)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 117, 151, 0.85)); }
    }
    @keyframes bloomPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 42, 117, 0.6)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(255, 42, 117, 0.95)); }
    }

    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .section-subtitle {
      font-family: 'Consolas', monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #ff8fae;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .skill-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e6ebf5;
    }
    .skill-level {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #ff7597;
      text-anchor: end;
      letter-spacing: 0.5px;
    }
    .animated-bars {
      animation: barGlow 3s infinite ease-in-out;
    }
    .animated-bloom {
      animation: bloomPulse 4s infinite ease-in-out;
      transform-origin: 425px 190px;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="20" fill="url(#skillsBg)" stroke="url(#borderGradSkills)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="425" cy="180" r="100" fill="#ff2a75" fill-opacity="0.1" filter="blur(30px)" />

  <!-- Title & Subtitle -->
  <text x="425" y="40" class="section-title">🌸 Technical Proficiencies &amp; Skills 🌸</text>
  <text x="425" y="60" class="section-subtitle">// HARDWARE ARCHITECTURE &#8226; EMBEDDED SYSTEMS &#8226; SOFTWARE //</text>

  <!-- ================= LEFT COLUMN: HARDWARE & VLSI ================= -->
  <!-- Skill 1: VLSI & Digital Logic -->
  <g transform="translate(45, 82)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">VLSI &amp; Verilog HDL</text>
    <text x="299" y="24" class="skill-level">CORE FOCUS</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="245" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 2: Embedded Systems & IoT -->
  <g transform="translate(45, 154)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">IoT &amp; Microcontrollers</text>
    <text x="299" y="24" class="skill-level">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="260" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 3: MATLAB & Simulink -->
  <g transform="translate(45, 226)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">MATLAB &amp; Simulink</text>
    <text x="299" y="24" class="skill-level">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="265" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- ================= CENTER SAKURA BLOOM ================= -->
  <g transform="translate(425, 200)" class="animated-bloom">
    <!-- Branch Stem -->
    <path d="M 0 75 Q -3 25 2 -15 T -5 -75 Q -3 -88 0 -95" stroke="#451221" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 15 Q -18 0 -28 5" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 1 -25 Q 22 -40 32 -33" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M -3 -55 Q -16 -65 -22 -62" stroke="#451221" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Top Blossom -->
    <g transform="translate(0, -96) scale(0.9)">
      <circle cx="-6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="-7" cy="5" r="6.5" fill="#ff4d8d" />
      <circle cx="7" cy="5" r="6.5" fill="#ff4d8d" />
      <circle cx="0" cy="8" r="6.5" fill="#ff2a75" />
      <circle cx="0" cy="2" r="2.8" fill="#fff" />
    </g>

    <!-- Branch Blossom Left -->
    <g transform="translate(-28, 5) scale(0.95)">
      <circle cx="-6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="-7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="0" cy="9" r="6.5" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3" fill="#fff" />
    </g>

    <!-- Branch Blossom Right -->
    <g transform="translate(32, -33) scale(1)">
      <circle cx="-6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="-7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="0" cy="10" r="7" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3.2" fill="#fff" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SOFTWARE & PROGRAMMING ================= -->
  <!-- Skill 4: C & Python -->
  <g transform="translate(490, 82)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">C &amp; Python Programming</text>
    <text x="299" y="24" class="skill-level">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="255" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 5: C++ -->
  <g transform="translate(490, 154)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">C++ (OOP &amp; Logic)</text>
    <text x="299" y="24" class="skill-level">LEARNING</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="195" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 6: Frontend Web Dev -->
  <g transform="translate(490, 226)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">Frontend Web Dev (React / JS)</text>
    <text x="299" y="24" class="skill-level">LEARNING</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="35" width="215" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>
</svg>
