<svg viewBox="0 0 850 330" width="100%" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d" />
      <stop offset="55%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#180b18" />
    </linearGradient>

    <linearGradient id="aboutBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>

    <filter id="sakuraGlowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 42, 117, 0.5)); }
    }
    .about-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ff7597;
      letter-spacing: 2px;
    }
    .about-head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 26px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .about-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: #aeb8c7;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #ff608f;
      animation: subtlePulse 3s infinite;
    }
    .stat-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #8c97a8;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #ffdbe6;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #9aa5b5;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="20" fill="url(#aboutBg)" stroke="url(#aboutBorder)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="720" cy="160" r="110" fill="#ff2a75" fill-opacity="0.1" filter="blur(30px)" />

  <!-- LEFT COLUMN -->
  <g transform="translate(45, 36)">
    <text x="0" y="0" class="about-tag">DISCOVER MY JOURNEY</text>
    <text x="0" y="32" class="about-head">🌸 About Me 🌸</text>
    
    <text x="0" y="66" class="about-body">I'm Santhiya B, a 3rd-semester B.Tech Electronics &amp; Communication</text>
    <text x="0" y="86" class="about-body">Engineering student. My primary focus is VLSI &amp; Digital Frontend Design,</text>
    <text x="0" y="106" class="about-body">combined with a passionate hobby for Embedded Systems, IoT &amp; Full-Stack.</text>

    <!-- 4 Stats Boxes Grid -->
    <g transform="translate(0, 130)">
      <!-- Stat 1: CGPA -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">9.23</text>
        <text x="14" y="44" class="stat-lbl">Academic CGPA (B.Tech ECE)</text>
      </g>
      
      <!-- Stat 2: Projects -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">4+ Key</text>
        <text x="14" y="44" class="stat-lbl">Hardware &amp; IoT Prototypes</text>
      </g>

      <!-- Stat 3: Primary Core -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">VLSI &amp; RTL</text>
        <text x="14" y="44" class="stat-lbl">Frontend Digital Focus</text>
      </g>

      <!-- Stat 4: Engineering Hobby -->
      <g transform="translate(200, 66)">
        <rect x="0" y="0" width="185" height="56" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
        <text x="14" y="26" class="stat-val">Embedded</text>
        <text x="14" y="44" class="stat-lbl">&amp; Full-Stack Developer</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Philosophy & Mission Cards -->
  <g transform="translate(485, 45)">
    <!-- Philosophy Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="110" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ff7597" stroke-opacity="0.15" stroke-width="1" />
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentLineGrad)" />
      <text x="20" y="30" class="card-title">✦ Hardware-Software Synergy</text>
      <text x="20" y="55" class="card-desc">Bridging the gap between silicon architecture</text>
      <text x="20" y="74" class="card-desc">and software engineering. Understanding how logic</text>
      <text x="20" y="93" class="card-desc">flows from silicon gates to interactive UIs.</text>
    </g>

    <!-- Mission Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="320" height="110" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ff7597" stroke-opacity="0.15" stroke-width="1" />
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentLineGrad)" />
      <text x="20" y="30" class="card-title">✦ The Vision</text>
      <text x="20" y="55" class="card-desc">Advancing semiconductor innovations, robust RTL</text>
      <text x="20" y="74" class="card-desc">designs, and resilient embedded IoT ecosystems</text>
      <text x="20" y="93" class="card-desc">that solve real-world emergency challenges.</text>
    </g>
  </g>
</svg>
