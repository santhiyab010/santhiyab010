<svg viewBox="0 0 850 330" width="100%" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Washi Paper Light) -->
    <linearGradient id="skillsBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8fa" />
      <stop offset="50%" stop-color="#ffeef3" />
      <stop offset="100%" stop-color="#fedce5" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradSkillsLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f06292" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec407a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Progress Bar Gradient (Crimson & Sakura) -->
    <linearGradient id="barGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2185b" />
      <stop offset="70%" stop-color="#e91e63" />
      <stop offset="100%" stop-color="#f48fb1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes barGlowLight {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(233, 30, 99, 0.35)); }
      50% { filter: drop-shadow(0 0 8px rgba(233, 30, 99, 0.75)); }
    }
    @keyframes bloomPulseLight {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(233, 30, 99, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 12px rgba(233, 30, 99, 0.8)); }
    }

    .section-title-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #221520;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .section-subtitle-light {
      font-family: 'Consolas', monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #ad1457;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .skill-title-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #221520;
    }
    .skill-level-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #c2185b;
      text-anchor: end;
      letter-spacing: 0.5px;
    }
    .animated-bars-light {
      animation: barGlowLight 3s infinite ease-in-out;
    }
    .animated-bloom-light {
      animation: bloomPulseLight 4s infinite ease-in-out;
      transform-origin: 425px 190px;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="20" fill="url(#skillsBgLight)" stroke="url(#borderGradSkillsLight)" stroke-width="1.5" />

  <!-- Ambient Watercolor Wash -->
  <circle cx="425" cy="180" r="100" fill="#f8bbd0" fill-opacity="0.3" filter="blur(30px)" />

  <!-- Title & Subtitle -->
  <text x="425" y="40" class="section-title-light">🌸 Technical Proficiencies &amp; Skills 🌸</text>
  <text x="425" y="60" class="section-subtitle-light">// HARDWARE ARCHITECTURE &#8226; EMBEDDED SYSTEMS &#8226; SOFTWARE //</text>

  <!-- ================= LEFT COLUMN: HARDWARE & VLSI ================= -->
  <!-- Skill 1: VLSI & Digital Logic -->
  <g transform="translate(45, 82)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">VLSI &amp; Verilog HDL</text>
    <text x="299" y="24" class="skill-level-light">CORE FOCUS</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="245" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>

  <!-- Skill 2: Embedded Systems & IoT -->
  <g transform="translate(45, 154)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">IoT &amp; Microcontrollers</text>
    <text x="299" y="24" class="skill-level-light">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="260" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>

  <!-- Skill 3: MATLAB & Simulink -->
  <g transform="translate(45, 226)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">MATLAB &amp; Simulink</text>
    <text x="299" y="24" class="skill-level-light">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="265" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>

  <!-- ================= CENTER SAKURA BLOOM ================= -->
  <g transform="translate(425, 200)" class="animated-bloom-light">
    <!-- Branch Stem (Sumi-e ink) -->
    <path d="M 0 75 Q -3 25 2 -15 T -5 -75 Q -3 -88 0 -95" stroke="#251320" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 15 Q -18 0 -28 5" stroke="#251320" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 1 -25 Q 22 -40 32 -33" stroke="#251320" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M -3 -55 Q -16 -65 -22 -62" stroke="#251320" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Top Blossom -->
    <g transform="translate(0, -96) scale(0.9)">
      <circle cx="-6" cy="-4" r="6.5" fill="#f48fb1" />
      <circle cx="6" cy="-4" r="6.5" fill="#f48fb1" />
      <circle cx="-7" cy="5" r="6.5" fill="#e91e63" />
      <circle cx="7" cy="5" r="6.5" fill="#e91e63" />
      <circle cx="0" cy="8" r="6.5" fill="#ad1457" />
      <circle cx="0" cy="2" r="2.8" fill="#fff" />
    </g>

    <!-- Branch Blossom Left -->
    <g transform="translate(-28, 5) scale(0.95)">
      <circle cx="-6" cy="-4" r="6.5" fill="#f48fb1" />
      <circle cx="6" cy="-4" r="6.5" fill="#f48fb1" />
      <circle cx="-7" cy="6" r="6.5" fill="#ec407a" />
      <circle cx="7" cy="6" r="6.5" fill="#ec407a" />
      <circle cx="0" cy="9" r="6.5" fill="#c2185b" />
      <circle cx="0" cy="3" r="3" fill="#fff" />
    </g>

    <!-- Branch Blossom Right -->
    <g transform="translate(32, -33) scale(1)">
      <circle cx="-6.5" cy="-4.5" r="7" fill="#f8bbd0" />
      <circle cx="6.5" cy="-4.5" r="7" fill="#f8bbd0" />
      <circle cx="-7.5" cy="6.5" r="7" fill="#e91e63" />
      <circle cx="7.5" cy="6.5" r="7" fill="#e91e63" />
      <circle cx="0" cy="10" r="7" fill="#ad1457" />
      <circle cx="0" cy="3" r="3.2" fill="#fff" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SOFTWARE & PROGRAMMING ================= -->
  <!-- Skill 4: C & Python -->
  <g transform="translate(490, 82)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">C &amp; Python Programming</text>
    <text x="299" y="24" class="skill-level-light">PROJECT EXP</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="255" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>

  <!-- Skill 5: C++ -->
  <g transform="translate(490, 154)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">C++ (OOP &amp; Logic)</text>
    <text x="299" y="24" class="skill-level-light">LEARNING</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="195" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>

  <!-- Skill 6: Frontend Web Dev -->
  <g transform="translate(490, 226)">
    <rect x="0" y="0" width="315" height="56" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
    <text x="16" y="24" class="skill-title-light">Frontend Web Dev (React / JS)</text>
    <text x="299" y="24" class="skill-level-light">LEARNING</text>
    <rect x="16" y="35" width="283" height="6" rx="3" fill="#f8bbd0" fill-opacity="0.5" />
    <rect x="16" y="35" width="215" height="6" rx="3" fill="url(#barGradLight)" class="animated-bars-light" />
  </g>
</svg>
