<svg viewBox="0 0 850 310" width="100%" height="310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="projBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a" />
      <stop offset="60%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#180a18" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="projBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.4" />
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="projTagGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>
  </defs>

  <style>
    .proj-head-dark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .proj-sub-dark {
      font-family: 'Consolas', monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #ff8fae;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .card-title-dark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      fill: #ffdce6;
    }
    .card-desc-dark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #9aa5b5;
    }
    .badge-txt-dark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    @keyframes fallPetalA {
      0% { transform: translate(0px, -20px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.75; }
      100% { transform: translate(-80px, 340px) rotate(320deg); opacity: 0; }
    }
    @keyframes fallPetalB {
      0% { transform: translate(0px, -20px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { transform: translate(70px, 340px) rotate(-280deg); opacity: 0; }
    }
    .p-fall-a { animation: fallPetalA 7.5s infinite linear; }
    .p-fall-b { animation: fallPetalB 9.0s infinite linear; animation-delay: 2.2s; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="306" rx="20" fill="url(#projBgDark)" stroke="url(#projBorderDark)" stroke-width="1.5" />

  <!-- Animated Falling Petals -->
  <g class="p-fall-a" transform="translate(220, 0)">
    <path d="M 0 0 C 5 -3, 10 2, 7 8 C 2 11, -3 8, 0 0 Z" fill="#ff7597" opacity="0.85" />
  </g>
  <g class="p-fall-b" transform="translate(640, 0)">
    <path d="M 0 0 C 6 -3, 11 3, 8 9 C 3 13, -3 9, 0 0 Z" fill="#ffa8c5" opacity="0.85" />
  </g>

  <!-- Title & Subtitle -->
  <text x="425" y="38" class="proj-head-dark">🌸 Featured Engineering Builds 🌸</text>
  <text x="425" y="58" class="proj-sub-dark">// HARDWARE PROTOTYPES &#8226; IOT SYSTEMS &#8226; CONTROL //</text>

  <!-- ================= 2x2 PROJECT CARDS GRID ================= -->
  <!-- Project 1: SOS WATCH -->
  <g transform="translate(45, 78)">
    <rect x="0" y="0" width="365" height="100" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="26" class="card-title-dark">📡 SOS WATCH (LoRa Emergency Comm.)</text>
    <text x="16" y="46" class="card-desc-dark">Wearable emergency communication system sending SOS</text>
    <text x="16" y="62" class="card-desc-dark">alerts off-grid without cellular network dependency.</text>
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="62" height="16" rx="4" fill="url(#projTagGradDark)" />
      <text x="31" y="11.5" class="badge-txt-dark">EMBEDDED</text>
      <rect x="68" y="0" width="45" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="90.5" y="11.5" class="badge-txt-dark">LoRa</text>
      <rect x="119" y="0" width="38" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="138" y="11.5" class="badge-txt-dark">IoT</text>
    </g>
  </g>

  <!-- Project 2: PATIENT MONITOR -->
  <g transform="translate(440, 78)">
    <rect x="0" y="0" width="365" height="100" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="26" class="card-title-dark">💓 PATIENT MONITOR (Real-Time Telemetry)</text>
    <text x="16" y="46" class="card-desc-dark">Continuous patient biometric tracking unit streaming</text>
    <text x="16" y="62" class="card-desc-dark">sensor data with ultra-low latency over Wi-Fi IoT.</text>
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="38" height="16" rx="4" fill="url(#projTagGradDark)" />
      <text x="19" y="11.5" class="badge-txt-dark">IoT</text>
      <rect x="44" y="0" width="58" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="73" y="11.5" class="badge-txt-dark">SENSORS</text>
      <rect x="108" y="0" width="68" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="142" y="11.5" class="badge-txt-dark">TELEMETRY</text>
    </g>
  </g>

  <!-- Project 3: SMART WAREHOUSE -->
  <g transform="translate(45, 190)">
    <rect x="0" y="0" width="365" height="100" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="26" class="card-title-dark">🤖 SMART WAREHOUSE (Inventory Automation)</text>
    <text x="16" y="46" class="card-desc-dark">Automated sensor package counting system slashing</text>
    <text x="16" y="62" class="card-desc-dark">manual auditing time and human error by over 80%.</text>
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="76" height="16" rx="4" fill="url(#projTagGradDark)" />
      <text x="38" y="11.5" class="badge-txt-dark">AUTOMATION</text>
      <rect x="82" y="0" width="38" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="101" y="11.5" class="badge-txt-dark">IoT</text>
      <rect x="126" y="0" width="65" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="158.5" y="11.5" class="badge-txt-dark">EMBEDDED</text>
    </g>
  </g>

  <!-- Project 4: PMSM MOTOR CONTROL -->
  <g transform="translate(440, 190)">
    <rect x="0" y="0" width="365" height="100" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="26" class="card-title-dark">⚡ PMSM CONTROL (Adaptive PID Tuning)</text>
    <text x="16" y="46" class="card-desc-dark">Dynamic PID auto-tuning algorithm in MATLAB &amp; Simulink</text>
    <text x="16" y="62" class="card-desc-dark">for high-efficiency synchronous motor regulation.</text>
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="58" height="16" rx="4" fill="url(#projTagGradDark)" />
      <text x="29" y="11.5" class="badge-txt-dark">CONTROL</text>
      <rect x="64" y="0" width="46" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="87" y="11.5" class="badge-txt-dark">PMSM</text>
      <rect x="116" y="0" width="55" height="16" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
      <text x="143.5" y="11.5" class="badge-txt-dark">MATLAB</text>
    </g>
  </g>
</svg>

