<svg viewBox="0 0 850 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070c" />
      <stop offset="60%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#190a18" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradSkills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.45" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="70%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ffaec5" />
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="tagExpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sakuraGlowSkills" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 42, 117, 0.5)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 117, 151, 0.9)); }
    }
    @keyframes bloomPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 42, 117, 0.6)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(255, 42, 117, 0.95)); }
    }

    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .section-subtitle {
      font-family: 'Consolas', monospace;
      font-weight: 600;
      font-size: 11.5px;
      fill: #ff8fae;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .skill-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e6ebf5;
    }
    .tag-txt {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.3px;
    }
    .animated-bars {
      animation: barGlow 3s infinite ease-in-out;
    }
    .animated-bloom {
      animation: bloomPulse 4s infinite ease-in-out;
      transform-origin: 425px 190px;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="356" rx="20" fill="url(#skillsBg)" stroke="url(#borderGradSkills)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="425" cy="190" r="100" fill="#ff2a75" fill-opacity="0.1" filter="blur(30px)" />

  <!-- Title & Subtitle -->
  <text x="425" y="42" class="section-title">🌸 SKILLS_DATABASE 🌸</text>
  <text x="425" y="64" class="section-subtitle">// HARDWARE ARCHITECTURE &bull; EMBEDDED &bull; SOFTWARE //</text>

  <!-- ================= LEFT COLUMN: HARDWARE & VLSI ================= -->
  <!-- Skill 1: VLSI & Digital Design (Verilog) -->
  <g transform="translate(45, 90)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">VLSI &amp; Verilog HDL</text>
    <rect x="220" y="11" width="82" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="261" y="24" class="tag-txt">EXPLORING</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="235" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 2: Embedded Systems & IoT -->
  <g transform="translate(45, 165)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">IoT &amp; Microcontrollers</text>
    <rect x="202" y="11" width="100" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="252" y="24" class="tag-txt">PROJECT EXP</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="260" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 3: MATLAB & Simulink -->
  <g transform="translate(45, 240)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">MATLAB / Simulink</text>
    <rect x="202" y="11" width="100" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="252" y="24" class="tag-txt">PROJECT EXP</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="265" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- ================= CENTER SAKURA BLOOM ================= -->
  <g transform="translate(425, 210)" class="animated-bloom">
    <!-- Branch Stem -->
    <path d="M 0 75 Q -3 25 2 -15 T -5 -75 Q -3 -88 0 -95" stroke="#451221" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 15 Q -18 0 -28 5" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 1 -25 Q 22 -40 32 -33" stroke="#451221" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M -3 -55 Q -16 -65 -22 -62" stroke="#451221" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Top Blossom -->
    <g transform="translate(0, -96) scale(0.9)">
      <circle cx="-6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="-7" cy="5" r="6.5" fill="#ff4d8d" />
      <circle cx="7" cy="5" r="6.5" fill="#ff4d8d" />
      <circle cx="0" cy="8" r="6.5" fill="#ff2a75" />
      <circle cx="0" cy="2" r="2.8" fill="#fff" />
    </g>

    <!-- Branch Blossom Left -->
    <g transform="translate(-28, 5) scale(0.95)">
      <circle cx="-6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="6" cy="-4" r="6.5" fill="#ff7597" />
      <circle cx="-7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="7" cy="6" r="6.5" fill="#ff4d8d" />
      <circle cx="0" cy="9" r="6.5" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3" fill="#fff" />
    </g>

    <!-- Branch Blossom Right -->
    <g transform="translate(32, -33) scale(1)">
      <circle cx="-6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="6.5" cy="-4.5" r="7" fill="#ffa0bd" />
      <circle cx="-7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="7.5" cy="6.5" r="7" fill="#ff4d8d" />
      <circle cx="0" cy="10" r="7" fill="#ff2a75" />
      <circle cx="0" cy="3" r="3.2" fill="#fff" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SOFTWARE & PROGRAMMING ================= -->
  <!-- Skill 4: C & Python -->
  <g transform="translate(490, 90)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">C &amp; Python Programming</text>
    <rect x="202" y="11" width="100" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="252" y="24" class="tag-txt">PROJECT EXP</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="250" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 5: C++ -->
  <g transform="translate(490, 165)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">C++ (OOP &amp; Logic)</text>
    <rect x="225" y="11" width="77" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="263.5" y="24" class="tag-txt">LEARNING</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="190" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>

  <!-- Skill 6: Frontend Web Dev -->
  <g transform="translate(490, 240)">
    <rect x="0" y="0" width="315" height="58" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff7597" stroke-opacity="0.18" stroke-width="1" />
    <text x="16" y="24" class="skill-title">Frontend Web Development</text>
    <rect x="225" y="11" width="77" height="18" rx="4" fill="url(#tagExpGrad)" />
    <text x="263.5" y="24" class="tag-txt">LEARNING</text>
    <rect x="16" y="36" width="283" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="16" y="36" width="205" height="6" rx="3" fill="url(#barGrad)" class="animated-bars" />
  </g>
</svg>
