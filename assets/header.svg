<svg viewBox="0 0 850 310" width="100%" height="310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070c" />
      <stop offset="50%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#190a18" />
    </linearGradient>

    <!-- Sakura Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a75" />
      <stop offset="50%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ffaec5" />
    </linearGradient>

    <!-- Fan Body Gradient -->
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#ff2a75" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#380d1e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ff2a75" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0.5" />
    </linearGradient>

    <!-- Filters -->
    <filter id="sakuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="petalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 42, 117, 0.45)); opacity: 0.95; }
      50% { filter: drop-shadow(0 0 25px rgba(255, 42, 117, 0.85)); opacity: 1; }
    }
    @keyframes floatPetal1 {
      0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.8; }
      100% { transform: translate(-150px, 170px) rotate(160deg); opacity: 0; }
    }
    @keyframes floatPetal2 {
      0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
      25% { opacity: 0.9; }
      75% { opacity: 0.7; }
      100% { transform: translate(-120px, 150px) rotate(-130deg); opacity: 0; }
    }
    @keyframes floatPetal3 {
      0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
      30% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% { transform: translate(-170px, 190px) rotate(180deg); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseCircuit {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.75; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .highlight-name {
      fill: url(#pinkGrad);
      filter: drop-shadow(0 0 15px rgba(255, 42, 117, 0.6));
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #ffb5cc;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      fill: #8f9db0;
    }
    .term-line {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      fill: #a6b5c9;
    }
    .term-prompt {
      fill: #ff2a75;
      font-weight: bold;
    }
    .cursor-blink {
      animation: blink 0.9s infinite;
      fill: #ff2a75;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #ffdce6;
    }
    .animated-fan {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .petal-anim-1 {
      animation: floatPetal1 6s infinite linear;
    }
    .petal-anim-2 {
      animation: floatPetal2 7.5s infinite linear;
      animation-delay: 2s;
    }
    .petal-anim-3 {
      animation: floatPetal3 8s infinite linear;
      animation-delay: 4s;
    }
    .circuit-line {
      animation: pulseCircuit 3s infinite ease-in-out;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="306" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background VLSI / Electronic Circuit Traces -->
  <g stroke="#ff2a75" stroke-width="1.2" fill="none" class="circuit-line">
    <path d="M 620 40 L 680 40 L 710 70 L 760 70" />
    <circle cx="760" cy="70" r="3" fill="#ff7597" />
    <path d="M 640 270 L 700 270 L 730 240 L 790 240" />
    <circle cx="790" cy="240" r="3" fill="#ff7597" />
    <path d="M 120 20 L 150 20 L 170 36 L 220 36" stroke-opacity="0.3" />
    <circle cx="220" cy="36" r="2.5" fill="#ff2a75" opacity="0.5" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="120" r="120" fill="#ff2a75" fill-opacity="0.12" filter="blur(35px)" />
  <circle cx="100" cy="240" r="80" fill="#ff7597" fill-opacity="0.08" filter="blur(25px)" />

  <!-- Top System Badge: SANTHIYA.EXE -->
  <g transform="translate(45, 24)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#ff2a75" fill-opacity="0.14" stroke="#ff7597" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#ff2a75" filter="url(#petalGlow)" />
    <text x="24" y="16" font-family="'Consolas', monospace" font-size="10.5" font-weight="700" fill="#ffa8c5" letter-spacing="1">SANTHIYA.EXE // ONLINE</text>
  </g>

  <!-- Main Title -->
  <text x="45" y="82" class="title-text">
    Hi, I'm <tspan class="highlight-name">Santhiya B</tspan> 🌸
  </text>

  <!-- Subtitle (From Portfolio) -->
  <text x="45" y="110" class="subtitle-text">
    ECE Student <tspan fill="#ff2a75">|</tspan> VLSI Enthusiast
  </text>
  <text x="45" y="130" class="tagline-text">
    Building at the intersection of electronics, hardware architecture, and software development.
  </text>

  <!-- Terminal Status Window (From Portfolio) -->
  <g transform="translate(45, 146)">
    <rect x="0" y="0" width="460" height="92" rx="10" fill="#040508" fill-opacity="0.85" stroke="#ff7597" stroke-opacity="0.25" stroke-width="1" />
    
    <!-- Terminal Header Dots -->
    <circle cx="16" cy="14" r="3.5" fill="#ff2a75" />
    <circle cx="28" cy="14" r="3.5" fill="#ffaec5" opacity="0.6" />
    <circle cx="40" cy="14" r="3.5" fill="#4d2033" />
    
    <!-- Terminal Lines -->
    <text x="16" y="38" class="term-line">
      <tspan class="term-prompt">&gt; USER:</tspan> SANTHIYA B
    </text>
    <text x="16" y="56" class="term-line">
      <tspan class="term-prompt">&gt; FIELD:</tspan> ELECTRONICS &amp; COMMUNICATION
    </text>
    <text x="16" y="74" class="term-line">
      <tspan class="term-prompt">&gt; INTEREST:</tspan> VLSI &amp; WEB DEVELOPMENT<tspan class="cursor-blink">_</tspan>
    </text>
  </g>

  <!-- Status Pills Row -->
  <g transform="translate(45, 256)">
    <!-- Pill 1: CGPA -->
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
    <text x="14" y="18" class="pill-text">🎓 CGPA: <tspan fill="#ff7597" font-weight="700">9.23</tspan></text>

    <!-- Pill 2: Degree -->
    <rect x="142" y="0" width="160" height="28" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ff7597" stroke-opacity="0.3" stroke-width="1" />
    <text x="156" y="18" class="pill-text">⚡ B.Tech ECE (3rd Sem)</text>

    <!-- Pill 3: Live Portfolio Link -->
    <rect x="314" y="0" width="180" height="28" rx="8" fill="#ff2a75" fill-opacity="0.12" stroke="#ff7597" stroke-opacity="0.4" stroke-width="1" />
    <text x="328" y="18" class="pill-text">🌐 thiya-portfolio.vercel.app</text>
  </g>

  <!-- RIGHT SIDE: Japanese Cherry Blossom Fan + VLSI Microchip Core -->
  <g transform="translate(685, 142)" class="animated-fan">
    <!-- Fan Outer Glow Aura -->
    <circle cx="0" cy="0" r="85" fill="#ff2a75" fill-opacity="0.22" filter="blur(16px)" />
    
    <!-- Fan Leaf Arc -->
    <path d="M -75 10 A 85 85 0 0 1 75 10 L 0 25 Z" fill="url(#fanGrad)" stroke="#ff94b8" stroke-width="1.5" />
    
    <!-- Fan Ribs -->
    <line x1="0" y1="25" x2="-65" y2="-18" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="25" x2="-45" y2="-45" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="25" x2="-20" y2="-62" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="25" x2="0" y2="-68" stroke="#ffd0df" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="0" y1="25" x2="20" y2="-62" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="25" x2="45" y2="-45" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="25" x2="65" y2="-18" stroke="#ffd0df" stroke-width="1" stroke-opacity="0.6" />

    <!-- VLSI Integrated Microchip Icon on Fan -->
    <g transform="translate(0, -28)">
      <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#08090f" stroke="#ff7597" stroke-width="1.5" />
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#ff2a75" fill-opacity="0.3" stroke="#ff94b8" stroke-width="1" />
      <text x="0" y="4" font-family="'Consolas', monospace" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">VLSI</text>
      <!-- Chip Pins -->
      <line x1="-22" y1="-8" x2="-18" y2="-8" stroke="#ffaec5" stroke-width="1.5" />
      <line x1="-22" y1="0" x2="-18" y2="0" stroke="#ffaec5" stroke-width="1.5" />
      <line x1="-22" y1="8" x2="-18" y2="8" stroke="#ffaec5" stroke-width="1.5" />
      <line x1="18" y1="-8" x2="22" y2="-8" stroke="#ffaec5" stroke-width="1.5" />
      <line x1="18" y1="0" x2="22" y2="0" stroke="#ffaec5" stroke-width="1.5" />
      <line x1="18" y1="8" x2="22" y2="8" stroke="#ffaec5" stroke-width="1.5" />
    </g>

    <!-- Fan Pivot / Rivet -->
    <circle cx="0" cy="25" r="6.5" fill="#ffeaf1" stroke="#ff2a75" stroke-width="2" />
    <circle cx="0" cy="25" r="2.5" fill="#ff2a75" />

    <!-- Hanging Pink Tassel -->
    <path d="M 0 32 L 0 55" stroke="#ff4d8d" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="0" cy="58" rx="4.5" ry="7.5" fill="#ff2a75" />
    <path d="M -3 64 L -5 82 M 0 65 L 0 84 M 3 64 L 5 82" stroke="#ffa3c4" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ANIMATED FALLING CHERRY BLOSSOM PETALS -->
  <g class="petal-anim-1" transform="translate(730, 40)" filter="url(#petalGlow)">
    <path d="M 0 0 C 6 -3, 12 3, 8 10 C 3 14, -4 10, 0 0 Z" fill="#ff7597" />
  </g>
  <g class="petal-anim-2" transform="translate(680, 70)" filter="url(#petalGlow)">
    <path d="M 0 0 C 5 -4, 11 2, 7 8 C 2 12, -3 9, 0 0 Z" fill="#ffa8c5" />
  </g>
  <g class="petal-anim-3" transform="translate(770, 90)" filter="url(#petalGlow)">
    <path d="M 0 0 C 7 -2, 13 4, 9 11 C 4 15, -3 11, 0 0 Z" fill="#ff4d8d" />
  </g>
</svg>
