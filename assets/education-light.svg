<svg viewBox="0 0 850 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Washi Paper Light) -->
    <linearGradient id="eduBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8fa" />
      <stop offset="50%" stop-color="#ffeef3" />
      <stop offset="100%" stop-color="#fedce5" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="eduBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f06292" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec407a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="tagPinkGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2185b" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
  </defs>

  <style>
    .edu-title-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: #221520;
      letter-spacing: 0.3px;
    }
    .item-title-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      fill: #880e4f;
    }
    .item-sub-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #544450;
    }
    .badge-txt-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    @keyframes fallPetalA {
      0% { transform: translate(0px, -20px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.75; }
      100% { transform: translate(-80px, 290px) rotate(320deg); opacity: 0; }
    }
    @keyframes fallPetalB {
      0% { transform: translate(0px, -20px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { transform: translate(70px, 290px) rotate(-280deg); opacity: 0; }
    }
    .p-fall-a { animation: fallPetalA 7.5s infinite linear; }
    .p-fall-b { animation: fallPetalB 9.0s infinite linear; animation-delay: 2.8s; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#eduBgLight)" stroke="url(#eduBorderLight)" stroke-width="1.5" />

  <!-- Animated Falling Petals -->
  <g class="p-fall-a" transform="translate(180, 0)">
    <path d="M 0 0 C 5 -3, 10 2, 7 8 C 2 11, -3 8, 0 0 Z" fill="#e91e63" opacity="0.8" />
  </g>
  <g class="p-fall-b" transform="translate(670, 0)">
    <path d="M 0 0 C 6 -3, 11 3, 8 9 C 3 13, -3 9, 0 0 Z" fill="#f48fb1" opacity="0.8" />
  </g>

  <!-- LEFT: Education Journey -->
  <g transform="translate(45, 28)">
    <text x="0" y="0" class="edu-title-light">🌸 Academic Background</text>

    <!-- College -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="355" height="74" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
      <text x="16" y="24" class="item-title-light">B.Tech Electronics &amp; Communication</text>
      <text x="16" y="44" class="item-sub-light">Kalasalingam Academy of Research and Education</text>
      <text x="16" y="62" class="item-sub-light" fill="#ad1457">✦ 3rd Semester &#8226; CGPA: 9.23</text>
      <rect x="286" y="14" width="56" height="20" rx="5" fill="url(#tagPinkGradLight)" />
      <text x="314" y="28" class="badge-txt-light">9.23 CGPA</text>
    </g>

    <!-- School -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="355" height="70" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
      <text x="16" y="24" class="item-title-light">Higher Secondary Education</text>
      <text x="16" y="44" class="item-sub-light">Sri Matha Matric Higher Secondary School</text>
      <text x="16" y="60" class="item-sub-light" fill="#ad1457">✦ Score: 90.16%</text>
      <rect x="286" y="14" width="56" height="20" rx="5" fill="url(#tagPinkGradLight)" />
      <text x="314" y="28" class="badge-txt-light">90.16%</text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="425" y1="30" x2="425" y2="230" stroke="#f06292" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- RIGHT: Target Sectors -->
  <g transform="translate(450, 28)">
    <text x="0" y="0" class="edu-title-light">🌸 Engineering Domains</text>

    <!-- Domain 1 -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="355" height="74" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
      <text x="16" y="24" class="item-title-light">PRIMARY: VLSI &amp; Digital Frontend Design</text>
      <text x="16" y="44" class="item-sub-light">Verilog HDL, Semiconductor Fundamentals, RTL Design</text>
      <text x="16" y="62" class="item-sub-light" fill="#ad1457">✦ Silicon architectures and hardware synthesis</text>
    </g>

    <!-- Domain 2 -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="355" height="70" rx="10" fill="#ffffff" stroke="#f48fb1" stroke-width="1.2" />
      <text x="16" y="24" class="item-title-light">SECONDARY: Embedded IoT &amp; Full-Stack</text>
      <text x="16" y="44" class="item-sub-light">Microcontrollers, LoRa wireless, React &amp; Modern Web</text>
      <text x="16" y="60" class="item-sub-light" fill="#ad1457">✦ End-to-end hardware-software integration</text>
    </g>
  </g>
</svg>

